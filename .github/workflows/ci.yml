name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Authoritative gate: the Python + Django versions Bevy Platform runs in
  # production. This job must pass.
  test:
    name: test (py3.11 / django 4.2 — Platform)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions
    - name: Tox Test
      run: tox
      env:
        PYTHON_VER: '3.11'
        DJANGO: '4.2'

  # Legacy interpreter/Django combinations, kept for reference only. Many of
  # these Python versions are EOL and may not even be installable on current
  # runners, so they are warn-only (continue-on-error) and never block a PR.
  legacy:
    name: "legacy (py${{ matrix.python-version }} / django ${{ matrix.django-version }})"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.5', '3.6', '3.7', '3.8', '3.9']
        django-version: ['main', '2.0', '2.1', '2.2', '3.0', '3.1', '3.2', '4.0']
        exclude:
          - python-version: '3.8'
            django-version: '2.0'
          - python-version: '3.9'
            django-version: '2.0'

          - python-version: '3.8'
            django-version: '2.1'
          - python-version: '3.9'
            django-version: '2.1'

          - python-version: '3.5'
            django-version: '3.0'

          - python-version: '3.5'
            django-version: '3.1'

          - python-version: '3.5'
            django-version: '3.2'

          - python-version: '3.5'
            django-version: '4.0'
          - python-version: '3.6'
            django-version: '4.0'
          - python-version: '3.7'
            django-version: '4.0'

          - python-version: '3.5'
            django-version: 'main'
          - python-version: '3.6'
            django-version: 'main'
          - python-version: '3.7'
            django-version: 'main'
          - python-version: '3.8'
            django-version: 'main'

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions
    - name: Tox Test
      run: tox
      env:
        PYTHON_VER: ${{ matrix.python-version }}
        DJANGO: ${{ matrix.django-version }}

  # Lint/docs checks pin very old tool versions (black 21.6b0, flake8 3.9.2) and
  # ancient node, which no longer install cleanly on current runners. Warn-only
  # until the toolchain is modernised.
  extra:
    name: "extra: ${{ matrix.extra-env }}"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        extra-env: ['docs', 'checkqa', 'standardjs']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      if: ${{ matrix.extra-env == 'standardjs' }}
      with:
        node-version: '8'
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
    - name: Tox Test
      run: tox
      env:
        TOXENV: ${{ matrix.extra-env }}
