[tox]
envlist =
    py{37,38,39}-django32
    py{38,39}-django40
    py{39}-djangomain
    docs
    checkqa
    standardjs

[testenv]
setenv =
    PYTHONWARNINGS = all
deps =
    coverage
    django32: Django==3.2.*
    django40: Django==4.0.*
    djangomain: git+https://github.com/django/django.git@main#egg=django
commands =
    coverage run manage.py test {posargs:allauth}
    coverage report
    coverage html

[testenv:docs]
skip_install = True
deps =
    Sphinx
allowlist_externals = make
commands =
    make -C {toxinidir}/docs html

[testenv:checkqa]
skip_install = True
ignore_errors = True
deps =
    flake8==3.9.2
    isort==5.8.0
    black==21.6b0
commands =
    flake8 {posargs:{toxinidir}/allauth}
    isort --check-only --skip-glob '*/migrations/*' --diff {posargs:{toxinidir}/allauth}
    black --check {posargs:{toxinidir}/allauth} {posargs:{toxinidir}/setup.py}

[testenv:isort]
basepython = python3.7
skip_install = True
deps =
    isort >5
commands =
    isort --skip-glob '*/migrations/*' {posargs:{toxinidir}/allauth}

[testenv:standardjs]
skip_install = True
allowlist_externals = /usr/bin/env
commands =
    /usr/bin/env bash -c "mkdir -p {toxinidir}/node_modules"
    /usr/bin/env npm install standard --no-lockfile --no-progress --non-interactive --silent
    /usr/bin/env bash -c "find {toxinidir}/allauth -name '*.js' | xargs {toxinidir}/node_modules/.bin/standard"

[coverage:run]
include = allauth*

[flake8]
exclude = migrations

[gh-actions:env]
PYTHON_VER =
    3.7: py37
    3.8: py38
    3.9: py39
DJANGO =
    main: djangomain
    3.2: django32
    4.0: django40
